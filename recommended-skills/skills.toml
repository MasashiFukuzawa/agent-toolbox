# Third-party skills that complement the toolbox plugin. install.py fetches each one from its
# upstream repository with `gh skill install`, scans it with the SkillSpector release pinned in
# tooling/skillspector, and installs it only if the scan passes. CI runs the same scan.

[[skill]]
repository = "mizchi/skills"
name = "empirical-prompt-tuning"
reason = "Evaluates a skill or prompt with fresh executors and iterates until improvements plateau."

[[skill]]
repository = "mattpocock/skills"
name = "grilling"
reason = "Stress-tests a plan or design by asking one question at a time."
