[project]
name = "agent-toolbox-tooling"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "pathspec>=0.12,<2",
    "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "ruff>=0.17.3,<1"]
# Not installed; pins the uv release that CI installs (setup-uv reads it from uv.lock) so Dependabot updates it.
uv = ["uv>=0.13.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/toolbox/skills/typescript-project-foundation/scripts/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py315"
# Bundled skill scripts and the installers run on the user's own Python, which may be older.
per-file-target-version = { "plugins/**/*.py" = "py311", "global-instructions/*.py" = "py311", "recommended-skills/*.py" = "py311" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
