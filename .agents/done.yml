version: 1
repo: agent-toolbox

# 4コマンドは AGENTS.md の完了ゲートと同一。CI (.github/workflows/ci.yml) も同じものを実行する。
# done 側は push 前に安く落とすための先行実行で、マージの保証は CI + branch protection が持つ。
verify:
  quick:
    - uv run ruff check .
    - uv run pytest
    - uv run python -m scripts.validate
    - uv run python -m scripts.trigger_eval --check
  standard:
    - uv run ruff check .
    - uv run pytest
    - uv run python -m scripts.validate
    - uv run python -m scripts.trigger_eval --check
    - bash -n plugins/done/scripts/quality-gate-stop.sh
  full:
    - uv run ruff check .
    - uv run pytest
    - uv run python -m scripts.validate
    - uv run python -m scripts.trigger_eval --check
    - bash -n plugins/done/scripts/quality-gate-stop.sh

# tier の実質的な差は verify のコマンド数ではなく、レビュー層の有無である。
#   quick    = 検証のみ
#   standard = ＋ advisor レビュー（簡素化観点を含む）
#   full     = ＋ 外部レビュー（逆エンジン）
# full は「変更を配布したあとで気づくと手戻りが大きいもの」に当たる。
# このリポジトリはスキル配布物なので、スキル本文と品質ゲートの定義そのものが該当する。
tier_floors:
  full:
    - "plugins/*/skills/*/SKILL.md"
    - "plugins/done/scripts/**"
    - ".agents/**"
    - ".github/workflows/**"
  quick:
    - "docs/**"
    - "**/*.md"
    - "evals/results/**"

docs:
  checks:
    - README と skill の description が実際の挙動と一致している
    - docs/trigger-registry.yml が skill の追加・削除・境界変更に追随している

review:
  criteria:
    - 指示が複数解釈を許さないか（実行するエージェントが意図と違う動きをしないか）
    - markdown 内の shell が実際に動くか（未定義の名前・macOS BSD 互換・引用）
    - host 中立性（Claude Code / Codex 固有の挙動を adapter として明示しているか）
    - 公開物として再利用可能か（組織固有名・絶対パス・認証情報が無いか）
  external:
    default: codex
    allowed:
      - codex
      - claude
