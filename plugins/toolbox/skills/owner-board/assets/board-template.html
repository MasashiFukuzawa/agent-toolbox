<!doctype html>
<!-- 主目的: 人間への依頼・回答・対応状況を一枚に集約し、判断と作業を追いやすくする。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--ink:#243044;--muted:#536176;--line:#d8dee8;--blue:#2455a4;--blue-soft:#edf3ff;--green:#286044;--green-soft:#eef8f1;--amber:#7a510c;--amber-soft:#fff6e6;--red:#a52e39;--red-soft:#fff0f1}
*{box-sizing:border-box}html{scroll-padding-top:24px}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:1060px;margin:0 auto;padding:40px 24px 80px}a{color:var(--blue);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #2455a4;outline-offset:4px}h1,h2,h3,h4,p{margin-top:0}h1{font-size:32px;letter-spacing:.02em;line-height:1.45;margin-bottom:8px}h2{font-size:22px;line-height:1.5;margin:32px 0 14px}h3{font-size:20px;line-height:1.5;margin:0}h4{font-size:16px;margin:22px 0 8px}p{margin-bottom:12px}ul,ol{padding-left:1.5em;margin:8px 0 14px}li+li{margin-top:5px}.eyebrow{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.09em;margin-bottom:8px}.meta,.muted{color:var(--muted);font-size:14px}.meta{margin-bottom:20px}.prototype{border:1px solid var(--line);padding:9px 14px;border-radius:8px;background:var(--surface);font-size:14px;margin-bottom:20px}.howto{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;padding:20px 24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.howto h2{font-size:16px;margin:0 0 6px}.howto p{margin:0}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-block;border-radius:5px;padding:2px 8px;font-size:13px;font-weight:700;line-height:1.7}.now{background:var(--red-soft);color:var(--red)}.soon{background:var(--amber-soft);color:var(--amber)}.preparing{background:#eef1f5;color:#536176}.decision{background:var(--blue-soft);color:var(--blue)}.task{background:var(--green-soft);color:var(--green)}.section-heading{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:30px}.section-heading h2{margin:0}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:12px 0 20px}.table-wrap table{margin:0}table{border-collapse:collapse;width:100%;font-size:15px}caption{text-align:left;padding:12px 14px;font-weight:700;color:var(--ink)}th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{background:#f5f7fa;font-size:13px;color:#46556b;font-weight:700}tbody tr:last-child td{border-bottom:0}.overview{min-width:650px}.overview th:nth-child(1){width:65px}.overview th:nth-child(2){width:155px}.overview th:nth-child(3){width:78px}.overview th:nth-child(5){width:220px}.id{font:700 16px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}.overview .id{color:var(--blue)}.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:20px 0;min-width:0}.card-header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px}.card-header .id{color:var(--blue);background:var(--blue-soft);padding:2px 9px;border-radius:6px}.card-header h3{flex:1 1 300px;min-width:0}.card-body{padding:22px 24px 10px;min-width:0}.ask{font-size:18px;font-weight:700;border-left:3px solid var(--blue);padding-left:13px;margin-bottom:18px;line-height:1.65}.facts{display:grid;grid-template-columns:9em minmax(0,1fr);gap:8px 20px;margin:0 0 18px}.facts>*{min-width:0}.facts dt{font-size:14px;color:var(--muted);font-weight:700}.facts dd{margin:0}.facts dd p:last-child{margin:0}.rec{background:var(--green-soft)}.recommendation{font-weight:700;color:var(--green);font-size:13px;display:inline-block}.options{min-width:560px}.options th:first-child{width:180px}.impact{background:var(--amber-soft);border-radius:8px;padding:12px 16px;margin:14px 0}.impact strong{color:var(--amber)}.reply{background:var(--blue-soft);border-radius:8px;padding:12px 16px;margin:16px 0;font-size:15px}.reply strong{display:inline;margin-right:8px}code{font: .9em/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;background:#edf0f5;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}.reply code{background:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;margin:0;font:14px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}pre code{font:inherit;padding:0;background:transparent}.code-box{border:1px solid var(--line);border-radius:8px;background:#f6f8fb;padding:14px 16px;position:relative;margin:10px 0 12px;min-width:0}.code-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.code-actions span{font-size:13px;color:var(--muted)}button{font:inherit;font-size:13px;border:1px solid #aebbd0;background:#fff;color:var(--blue);border-radius:5px;cursor:pointer;padding:3px 10px}button:hover{background:var(--blue-soft)}.copy-status{font-size:13px;color:var(--blue);min-height:1.75em;margin:2px 0 0}.steps{padding-left:1.6em;margin:0}.steps>li{padding-left:5px;margin-bottom:16px}.steps p{margin:3px 0}.prep-card .card-header{background:#f8f9fb;border-radius:12px 12px 0 0}.prep-card .ask{border-color:#8997ac;color:#46556b}.prep-card .card-header .id{background:#eef1f5;color:#536176}.pending{background:var(--amber-soft);border:1px solid #e7d3ad;border-radius:10px;padding:16px 20px;margin:20px 0}.pending h2{font-size:16px;margin:0 0 6px}.pending p{margin:0}.archive{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 18px}.archive summary{cursor:pointer;font-weight:700;padding:15px 0}.archive .table-wrap{margin-top:0}.archive table{min-width:600px}.archive td:first-child{width:65px}.archive td:nth-child(2){width:220px}.related{padding:16px 20px;border:1px solid var(--line);border-radius:10px;background:#fff}.related p{margin:0}.related a{margin-right:16px}.footer{margin-top:28px;color:var(--muted);font-size:13px}.visual{border:1px solid var(--line);background:#fafbfd;border-radius:8px;padding:14px;margin:16px 0}.visual-scroll{overflow-x:auto}.visual svg{display:block;width:100%;height:auto;min-width:500px}.visual figcaption{font-size:14px;color:var(--muted);margin-top:8px}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.report-note{margin:14px 0;color:var(--muted);font-size:14px}li,dd,p,h3{overflow-wrap:anywhere}
@media(max-width:680px){main{padding:24px 14px 48px}h1{font-size:26px}.howto{grid-template-columns:minmax(0,1fr);padding:18px;gap:16px}.card-header{padding:16px}.card-header h3{flex-basis:100%;font-size:18px;order:2}.card-body{padding:18px 16px 8px}.facts{grid-template-columns:minmax(0,1fr);gap:4px}.facts dt:not(:first-child){margin-top:10px}.ask{font-size:17px}.table-wrap{border-radius:7px}.reply strong{display:block}.section-heading{gap:6px}.visual{padding:10px}.pending{padding:14px 16px}}
.options tr:has(.recommendation){background:var(--green-soft)}</style>
</head>
<body><main>{{BODY}}</main>
<script>
document.querySelectorAll('[data-copy]').forEach(button=>{button.hidden=false;button.addEventListener('click',async()=>{const code=document.getElementById(button.dataset.copy);const status=button.closest('.code-box').querySelector('.copy-status');try{if(!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(code.textContent);status.textContent='コピーしました。';}catch(error){const range=document.createRange();range.selectNodeContents(code);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);status.textContent='コマンドを選択しました。端末のコピー操作を使ってください。';}});});
</script>
</body>
</html>
