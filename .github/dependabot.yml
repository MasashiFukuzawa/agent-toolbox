version: 2
# All ecosystems share one weekly pull request. Separate pull requests would leave each other
# behind main after every merge, and Dependabot does not rebase a pull request that is only behind.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
# Cooldown holds back newly published versions so that a compromised release is likely
# to be caught and yanked before it is proposed here.
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /tooling/skillspector
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /tooling/claude-code
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
