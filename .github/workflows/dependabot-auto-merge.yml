name: dependabot-auto-merge
# Queues Dependabot's minor and patch updates to merge once the required checks pass.
# Major updates, updates whose type Dependabot cannot classify, and updates whose package
# maintainers changed are left for review. Git sources pinned to semver tags count as versions.
on: pull_request
permissions:
  contents: read
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
          && steps.metadata.outputs.maintainer-changes != 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
