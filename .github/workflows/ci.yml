name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  UV_VERSION: "0.13.6"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the pinned Claude Code CLI
        working-directory: tooling/claude-code
        # Lifecycle scripts stay off; only Claude Code's own installer runs to link its native binary.
        run: |
          npm ci --ignore-scripts
          node node_modules/@anthropic-ai/claude-code/install.cjs
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -m scripts.validate
      - run: uv run python -m scripts.trigger_eval --check
      - run: bash -n plugins/done/scripts/quality-gate-stop.sh
      - name: Validate Claude Code plugin manifest
        run: tooling/claude-code/node_modules/.bin/claude plugin validate .
  minimum-python:
    # pyproject.toml declares Python 3.11+, and the bundled scripts run on the user's Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - run: uv sync --dev --locked
      - run: uv run pytest
  skill-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run SkillSpector static scan
        run: bash tooling/skillspector-scan.sh /tmp/skillspector
